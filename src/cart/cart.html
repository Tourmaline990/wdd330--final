<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Companion | Cart</title>
    <script src="../js/cart.js" type="module"></script>
  </head>
  <body>
    <header></header>
    <main>
      <article>
        <div>
          <button title="clear cart" id="clearCart">X</button>
        </div>
        <section class="summary">
          <p>Cart Summary</p>
          <div>
            <h1>Subtotal</h1>
            <p id="subtotal"></p>
          </div>
        </section>
        <section id="container"></section>
        <section class="checks">
          <img src="/images/svgs/telephone.svg" alt="call icon" />
          <button id="checkout">CheckOut <span id="total"></span></button>
        </section>
      </article>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
