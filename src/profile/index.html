<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Companion | Profile</title>
    <script src="../js/profile.js" type="module"></script>
  </head>
  <body>
    <header></header>
    <main>
      <article>
        <div>
          <a href="../index.html"
            ><img
              src="/images/svgs/arrow-left-short.svg"
              alt="back"
              loading="lazy"
          /></a>
          <h1>Profile</h1>
        </div>
        <div>
          <div id="avatar"></div>
          <h2 id="username"></h2>
        </div>
        <section>
          <h3>Account</h3>
          <div>
            <img
              src="/images/svgs/person-circle.svg"
              alt="profile icon"
              loading="lazy"
            />
            <a href="../cart/cart.html">Personal Data</a>
          </div>
          <div>
            <img
              src="/images/svgs/file-richtext.svg"
              alt="history"
              loading="lazy"
            />
            <a href="../order/index.html">Order History</a>
          </div>
          <div>
            <img src="/images/svgs/bag-heart-fill.svg" alt="" loading="lazy" />
            <a href="../cart/cart.html">Wishlist</a>
          </div>
          <div>
            <img
              src="/images/svgs/box-arrow-right.svg"
              alt="LogOut"
              loading="lazy"
            />
            <a href="">Logout</a>
          </div>
        </section>
        <section>
          <h3>Other</h3>
          <div>
            <img
              src="/images/svgs/envelope.svg"
              alt="contact us"
              loading="lazy"
            />
            <a href="#">Contact Us</a>
          </div>
          <div>
            <img
              src="/images/svgs/shield-check.svg"
              alt="privacy icon"
              loading="lazy"
            />
            <a href="#">Privacy Policy</a>
          </div>
          <div>
            <div>
              <img
                src="/images/svgs/gear.svg"
                alt="setting icon"
                loading="lazy"
              />
              <a href="#">Settings</a>
            </div>
          </div>
        </section>
      </article>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
