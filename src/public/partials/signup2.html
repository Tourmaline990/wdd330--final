<h1>Create Password</h1>
<form method="get">
  <p id="notify"></p>
  <label for="setPassword">Enter Password</label>
  <input
    type="text"
    name="password"
    title="set a password"
    id="setPassword"
    required
    min="8"
  />

  <label for="c-password">Re-enter Password</label>
  <input
    type="text"
    name="c-password"
    id="c-password"
    title="must match first password"
    required
    min="8"
  />
</form>

<button id="signup2">Sign Up</button>
