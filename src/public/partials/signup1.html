<h1>Sign Up</h1>
<form method="get">
  <label for="name">Enter A Username: </label>
  <input type="text" id="name" title="username" required />
  <label for="email">Email</label>
  <input
    type="email"
    name="email"
    id="email"
    required
    autocomplete="email"
    title="enter email"
    min="8"
  />
</form>
<button id="signup1">Next</button>
